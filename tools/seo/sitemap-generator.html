<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XML Sitemap Generator — Free SEO Tool | ToolBox</title>
<meta name="description" content="Free XML sitemap generator. Paste your URLs and generate a valid XML sitemap file instantly. Download and submit to Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<script>window.PAGE_DEPTH = 2;</script>
</head><body>
<div id="nav-placeholder"></div>
<div class="page-wrapper">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="tool-page">
      <div class="tool-header">
        <div class="breadcrumb"><a href="../../index.html">Home</a> › <a href="../../index.html#seo-tools">SEO Tools</a> › Sitemap Generator</div>
        <h1>🗺️ XML Sitemap Generator</h1>
        <p>Paste your URLs (one per line) and generate a valid XML sitemap you can submit to Google Search Console.</p>
        <a href="../../blog/sitemap-generator.html" style="font-size:13px;color:var(--accent);font-weight:600;display:inline-block;margin-top:0.5rem;">📖 Read the full guide & FAQs →</a>
      </div>
      <div class="tool-body">
        <div class="tool-panel">
          <div class="panel-title">Enter Your URLs</div>
          <textarea id="urls" class="w-full mono" style="min-height:200px;" placeholder="https://yoursite.com/&#10;https://yoursite.com/about/&#10;https://yoursite.com/blog/&#10;https://yoursite.com/contact/"></textarea>
          <div style="font-size:12px;color:var(--text3);margin-top:6px;" id="url-count">0 URLs detected</div>
        </div>
        <div class="tool-panel">
          <div class="panel-title">Default Settings</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
            <div class="form-group" style="margin:0;">
              <label class="form-label">Change Frequency</label>
              <select id="changefreq">
                <option value="weekly">weekly</option>
                <option value="daily">daily</option>
                <option value="monthly">monthly</option>
                <option value="always">always</option>
                <option value="hourly">hourly</option>
                <option value="yearly">yearly</option>
                <option value="never">never</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;">
              <label class="form-label">Priority</label>
              <select id="priority">
                <option value="0.8">0.8 (High)</option>
                <option value="1.0">1.0 (Highest)</option>
                <option value="0.6">0.6 (Medium)</option>
                <option value="0.4">0.4 (Low)</option>
                <option value="0.2">0.2 (Lowest)</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;">
              <label class="form-label">Last Modified</label>
              <input type="date" id="lastmod">
            </div>
          </div>
        </div>
        <div class="tool-actions">
          <button class="btn btn-primary" onclick="generate()">🗺️ Generate Sitemap</button>
          <button class="btn btn-secondary btn-sm" onclick="loadSample()">📄 Load Sample URLs</button>
        </div>
        <div id="output-panel" style="display:none;" class="tool-panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;flex-wrap:wrap;gap:8px;">
            <div class="panel-title" style="margin:0;">Generated sitemap.xml</div>
            <div style="display:flex;gap:8px;">
              <span id="url-count-out" style="font-size:12px;color:var(--text3);align-self:center;"></span>
              <button class="copy-btn" onclick="copyText(document.getElementById('output').textContent,this)">📋 Copy</button>
              <button class="btn btn-secondary btn-sm" onclick="downloadText(document.getElementById('output').textContent,'sitemap.xml')">⬇ Download sitemap.xml</button>
            </div>
          </div>
          <pre class="output-box" id="output" style="font-size:12px;line-height:1.7;max-height:400px;overflow:auto;"></pre>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="footer-placeholder"></div>
<script src="../../js/main.js"></script>
<script src="../../js/layout.js"></script>
<script>
document.getElementById('lastmod').value=new Date().toISOString().split('T')[0];
document.getElementById('urls').addEventListener('input',()=>{
  const urls=getUrls();
  document.getElementById('url-count').textContent=`${urls.length} URL${urls.length!==1?'s':''} detected`;
});
function getUrls(){
  return document.getElementById('urls').value.split('\n').map(s=>s.trim()).filter(s=>s&&s.startsWith('http'));
}
function generate(){
  const urls=getUrls();
  if(!urls.length){toast('Please enter at least one valid URL starting with http','danger');return;}
  const freq=document.getElementById('changefreq').value;
  const priority=document.getElementById('priority').value;
  const lastmod=document.getElementById('lastmod').value;
  const lines=[
    '<?xml version="1.0" encoding="UTF-8"?>',
    '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
  ];
  urls.forEach(url=>{
    lines.push('  <url>');
    lines.push(`    <loc>${url}</loc>`);
    if(lastmod)lines.push(`    <lastmod>${lastmod}</lastmod>`);
    lines.push(`    <changefreq>${freq}</changefreq>`);
    lines.push(`    <priority>${priority}</priority>`);
    lines.push('  </url>');
  });
  lines.push('</urlset>');
  document.getElementById('output').textContent=lines.join('\n');
  document.getElementById('url-count-out').textContent=`${urls.length} URLs`;
  document.getElementById('output-panel').style.display='block';
  document.getElementById('output-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
  toast(`Sitemap generated with ${urls.length} URLs`,'success');
}
function loadSample(){
  document.getElementById('urls').value='https://example.com/\nhttps://example.com/about/\nhttps://example.com/blog/\nhttps://example.com/contact/\nhttps://example.com/services/';
  document.getElementById('url-count').textContent='5 URLs detected';
}
document.addEventListener('DOMContentLoaded',()=>initToolPage('sitemap-generator'));
</script>
</body></html>
