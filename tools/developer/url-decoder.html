<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Decoder — Free Online Tool | ToolBox</title>
<meta name="description" content="Free online URL decoder. Decode URL-encoded strings back to readable text instantly in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<script>window.PAGE_DEPTH = 2;</script>
</head><body>
<div id="nav-placeholder"></div>
<div class="page-wrapper">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="tool-page">
      <div class="tool-header">
        <div class="breadcrumb"><a href="../../index.html">Home</a> › <a href="../../index.html#developer-tools">Developer</a> › URL Decoder</div>
        <h1>🔗 URL Decoder</h1>
        <p>Decode URL-encoded strings (percent-encoded characters) back to human-readable text.</p>
        <a href="../../blog/url-decoder.html" style="font-size:13px;color:var(--accent);font-weight:600;display:inline-block;margin-top:0.5rem;">📖 Read the full guide & FAQs →</a>
      </div>
      <div class="tool-body">
        <div class="tool-panel">
          <div class="panel-title">URL-Encoded String to Decode</div>
          <textarea id="input" class="w-full mono" style="min-height:140px;" placeholder="Paste URL-encoded string here…&#10;Example: Hello%20World%20%26%20more%21" oninput="liveDecode()"></textarea>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-top:0.5rem;cursor:pointer;">
            <input type="checkbox" id="form-encoded" onchange="decode()">
            Treat <code>+</code> as space (form-encoded query strings only)
          </label>
          <div class="tool-actions mt-2">
            <button class="btn btn-primary" onclick="decode()">🔓 Decode URL</button>
            <button class="btn btn-secondary btn-sm" onclick="clearAll()">🗑 Clear</button>
            <button class="btn btn-secondary btn-sm" onclick="pasteText()">📋 Paste</button>
          </div>
        </div>
        <div id="error-box" class="alert alert-danger" style="display:none;"></div>
        <div id="output-panel" style="display:none;" class="tool-panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
            <div class="panel-title" style="margin:0;">Decoded Text</div>
            <button class="copy-btn" onclick="copyText(document.getElementById('output').value,this)">📋 Copy</button>
          </div>
          <textarea id="output" class="w-full mono" style="min-height:80px;" readonly></textarea>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="footer-placeholder"></div>
<script src="../../js/main.js"></script>
<script src="../../js/layout.js"></script>
<script>
let timer;
function liveDecode(){clearTimeout(timer);timer=setTimeout(decode,300);}
function decode(){
  document.getElementById('error-box').style.display='none';
  const input=document.getElementById('input').value.trim();
  if(!input){document.getElementById('output-panel').style.display='none';return;}
  try{
    const treatPlusAsSpace=document.getElementById('form-encoded').checked;
    const decoded=decodeURIComponent(treatPlusAsSpace?input.replace(/\+/g,' '):input);
    document.getElementById('output').value=decoded;
    document.getElementById('output-panel').style.display='block';
  }catch(e){
    document.getElementById('error-box').innerHTML='❌ Invalid URL-encoded string: '+e.message;
    document.getElementById('error-box').style.display='flex';
    document.getElementById('output-panel').style.display='none';
  }
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output-panel').style.display='none';document.getElementById('error-box').style.display='none';}
async function pasteText(){try{document.getElementById('input').value=await navigator.clipboard.readText();decode();}catch{toast('Paste permission denied','danger');}}
document.addEventListener('DOMContentLoaded',()=>initToolPage('url-decoder'));
</script>
</body></html>
