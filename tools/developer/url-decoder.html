<script>
let timer;
function liveDecode(){clearTimeout(timer);timer=setTimeout(decode,300);}
function decode(){
  document.getElementById('error-box').style.display='none';
  const input=document.getElementById('input').value.trim();
  if(!input){document.getElementById('output-panel').style.display='none';return;}
  try{
    const treatPlusAsSpace=document.getElementById('form-encoded').checked;
    const decoded=decodeURIComponent(treatPlusAsSpace?input.replace(/\+/g,' '):input);
    document.getElementById('output').value=decoded;
    document.getElementById('output-panel').style.display='block';
  }catch(e){
    document.getElementById('error-box').innerHTML='❌ Invalid URL-encoded string: '+escapeHtml(e.message);
    document.getElementById('error-box').style.display='flex';
    document.getElementById('output-panel').style.display='none';
  }
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output-panel').style.display='none';document.getElementById('error-box').style.display='none';}
function pasteText(){pasteInto('input', decode);}
document.addEventListener('DOMContentLoaded',()=>initToolPage('url-decoder'));
</script>
