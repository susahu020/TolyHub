<script>
let timer;
function liveEncode(){clearTimeout(timer);timer=setTimeout(encode,300);}
function encode(){
  const input=document.getElementById('input').value;
  if(!input){document.getElementById('output-panel').style.display='none';return;}
  const mode=document.querySelector('input[name="mode"]:checked').value;
  const encoded=mode==='component'?encodeURIComponent(input):encodeURI(input);
  document.getElementById('output').value=encoded;
  document.getElementById('output-panel').style.display='block';
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output-panel').style.display='none';}
function pasteText(){pasteInto('input', encode);}
document.addEventListener('DOMContentLoaded',()=>initToolPage('url-encoder'));
</script>
