<script>
let timer;
function liveValidate(){clearTimeout(timer);timer=setTimeout(()=>{if(document.getElementById('input').value.trim())validate();},600);}
function validate(){
  const input=document.getElementById('input').value.trim();
  const panel=document.getElementById('result-panel');
  if(!input){panel.style.display='none';return;}
  try{
    const parsed=JSON.parse(input);
    const info=getInfo(parsed);
    panel.innerHTML=`<div class="alert alert-success" style="flex-direction:column;align-items:flex-start;gap:8px;">
      <div style="font-size:16px;font-weight:700;">✅ Valid JSON</div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;">
        ${info.map(i=>`<span style="font-size:13px;background:rgba(255,255,255,0.3);padding:2px 10px;border-radius:99px;">${i}</span>`).join('')}
      </div>
    </div>`;
  }catch(e){
    const pos=getErrorPos(document.getElementById('input').value,e);
    panel.innerHTML=`<div class="alert alert-danger" style="flex-direction:column;align-items:flex-start;gap:8px;">
      <div style="font-size:16px;font-weight:700;">❌ Invalid JSON</div>
      <div style="font-size:14px;">${escapeHtml(e.message)}</div>
      ${pos?`<div style="font-size:13px;">📍 ${pos}</div>`:''}
    </div>`;
  }
  panel.style.display='block';
}
function getInfo(obj){
  const type=Array.isArray(obj)?'Array':typeof obj;
  const keys=typeof obj==='object'&&obj!==null?Object.keys(obj).length:0;
  return[`Type: ${type}`,keys?`Top-level keys: ${keys}`:'',`Size: ${JSON.stringify(obj).length} chars`].filter(Boolean);
}
function getErrorPos(text,err){
  // Modern V8/Chrome format: "... (line 3 column 8)"
  const lc=err.message.match(/line (\d+) column (\d+)/i);
  if(lc)return`Line ${lc[1]}, Column ${lc[2]}`;
  // Legacy format: "... at position 42"
  const m=err.message.match(/position (\d+)/);
  if(m){
    const pos=parseInt(m[1]);
    const lines=text.slice(0,pos).split('\n');
    return`Line ${lines.length}, Column ${lines[lines.length-1].length+1}`;
  }
  return null;
}
function clearResult(){document.getElementById('result-panel').style.display='none';}
function loadSample(){document.getElementById('input').value=`{"valid":true,"example":"this is valid JSON","numbers":[1,2,3],"nested":{"key":"value"}}`;validate();}
document.addEventListener('DOMContentLoaded',()=>initToolPage('json-validator'));
</script>
