<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee" />
      <stop offset="50%" stop-color="#5c3be6" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    
    <!-- Drop Shadow for the white monogram -->
    <filter id="monogram-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Hexagon (Pointy Top, stroke rounded) -->
  <polygon points="256,40 443,148 443,364 256,472 69,364 69,148" 
           fill="url(#brand-grad)" 
           stroke="url(#brand-grad)" 
           stroke-width="24" 
           stroke-linejoin="round" />

  <!-- White Interlocking "TH" Monogram -->
  <path d="M 160,176 A 16,16 0 0,1 192,176 L 192,240 L 320,240 L 320,176 A 16,16 0 0,1 352,176 L 352,336 A 16,16 0 0,1 320,336 L 320,272 L 272,272 L 272,336 A 16,16 0 0,1 240,336 L 240,272 L 192,272 L 192,336 A 16,16 0 0,1 160,336 Z" 
        fill="#ffffff" 
        filter="url(#monogram-shadow)" />
</svg>
